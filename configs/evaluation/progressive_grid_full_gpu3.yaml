defaults:
  - eval_progressive_grid_vggt
  - _self_

# Final disjoint shard of the Uniform-25% evaluation.
selected_datasets: [7scenes, eth3d]

datasets:
  7scenes:
    scenes: [stairs]
    sample_mode: uniform
    max_frames: 128
    eval_tasks: [pose, recon_unposed]

  eth3d:
    scenes: [relief_2, terrains]
    sample_mode: uniform
    max_frames: 128
    eval_tasks: [pose, recon_unposed]
