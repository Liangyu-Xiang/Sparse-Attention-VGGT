defaults:
  - default_datasets.yaml
  - _self_
model:
  name: VGGT
  dpt_only: True
  ckpt_path: checkpoints/vggt/model_tracker_fixed_e20.pt
  patch_module:
    type: adaptive_block_value
    retention: 0.10
    budget_candidates: [0.10, 0.20, 0.35, 0.50, 0.75, 1.0]
    audit_nmse: 0.02
    audit_p90: 0.10
    audit_queries: 32
    query_block: 64
    key_block: 64
    history_min_blocks: 4
    fine_ratio: 0.15
    coarse_size: 128
    audit_guard: true

selected_datasets: [7scenes]
datasets:
  7scenes:
    scenes: [chess, fire, heads, office, pumpkin, redkitchen, stairs]
    sample_mode: uniform
    max_frames: 128
    eval_tasks: [pose]
