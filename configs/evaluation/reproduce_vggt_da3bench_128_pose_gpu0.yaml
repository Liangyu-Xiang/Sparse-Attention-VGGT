defaults:
  - eval_vggt
  - _self_

# A pose-only companion run for early validation of SAF3R Table 2.  The full
# pose-plus-reconstruction runs remain in the three shard configurations.
selected_datasets: [7scenes, eth3d]

datasets:
  7scenes:
    sample_mode: uniform
    max_frames: 128
    eval_tasks: [pose]

  eth3d:
    sample_mode: uniform
    max_frames: 128
    eval_tasks: [pose]
