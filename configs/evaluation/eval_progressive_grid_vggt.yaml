defaults:
  - default_datasets.yaml
  - _self_

# Progressive token-level sparse VGGT.  The existing SAF3R profile supplies
# functional groups only; its original head-specific sparse kernels are not
# used in this experiment.
model:
  name: VGGT
  dpt_only: True
  ckpt_path: checkpoints/vggt/model_tracker_fixed_e20.pt
  functional_group_config_path: configs/sparse_attn/vggt/eth3d-train-fltr-calib_cmpmse.json
  patch_module:
    type: progressive_grid
    # Fraction of 2x2 patch grids retained per patch query.  1.0 means one
    # key from every grid, i.e. approximately 25% patch-key retention for any
    # number of input frames.  This is the initial Uniform-25% sanity check.
    grid_keep_ratio: 1.0
    # Keep this baseline purely uniform.  Once it is validated, changing this
    # to 0.75 enables the gradual 0 -> 25 -> 50 -> 75% schedule below.
    exploitation_ratio: 0.0
    exploitation_step: 0.25
    evidence_decay: 0.60
    score_chunk_size: 1024

selected_datasets: [7scenes, eth3d]

datasets:
  7scenes:
    max_frames: 128
    sample_mode: uniform
    eval_tasks: [pose, recon_unposed]

  eth3d:
    max_frames: 128
    sample_mode: uniform
    eval_tasks: [pose, recon_unposed]
