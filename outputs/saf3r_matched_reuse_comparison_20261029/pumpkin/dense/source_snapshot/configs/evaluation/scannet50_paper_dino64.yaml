# Paper-mechanism reproduction candidate; per-scene K is not published.
# No global cap: 700 frames * 64 keys/frame = 44800.
# This is NOT the official repo lazy Top-4 default.
model:
  name: VGGT
  dpt_only: true
  ckpt_path: checkpoints/vggt/model_tracker_fixed_e20.pt
  sparse_config_path: configs/sparse_attn/vggt/eth3d-train-fltr-calib_cmpmse.json
  patch_module:
    type: headsparse
    topk_mode: token
    lazy_dino_topk: false
    topk: 64
    per_frame_topk: true
    max_topk: 44800
    include_first_frame: false
